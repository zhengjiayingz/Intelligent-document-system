<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第三方 ECharts 页（无提取逻辑）</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --border: #2a3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 720px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    #chart {
      width: 100%;
      height: 380px;
      background: #111822;
      border-radius: 8px;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      background: #2a3548;
      color: var(--text);
      font-weight: 600;
    }
    button.primary { background: var(--accent); color: #fff; }
    .hint { margin-top: 12px; font-size: 0.85rem; color: var(--muted); }
    code { color: #9ec1ff; }
    .log {
      margin-top: 10px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      background: #0c1017;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      display: none;
    }
    .log.show { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>模拟第三方页面（只有图表）</h1>
    <p class="lead">
      本页<strong>不含任何提取代码</strong>。数据在闭包里随机生成。请用旁边的
      <code>extension/</code> 浏览器插件来扫 tooltip 取数。
    </p>

    <section class="card">
      <h2>别人的 ECharts</h2>
      <div id="chart"></div>
      <div class="toolbar">
        <button type="button" id="btn-reshuffle" class="primary">重新随机生成</button>
        <button type="button" id="btn-reveal">揭晓真值（仅本页验收）</button>
      </div>
      <p class="hint">
        加载插件后打开本页 → 点扩展图标 →「提取当前页图表」。再点「揭晓真值」对比是否一致。
      </p>
      <pre class="log" id="secret-out"></pre>
    </section>
  </main>

  <script>
    const SitePrivate = (() => {
      let secretCategories = [];
      let secretValues = [];
      let chart = null;

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function buildRandomSeries() {
        const n = randInt(5, 8);
        const cats = [];
        const vals = [];
        for (let i = 0; i < n; i++) {
          cats.push(`类目${String.fromCharCode(65 + i)}`);
          vals.push(randInt(20, 180));
        }
        secretCategories = cats;
        secretValues = vals;
        return { cats, vals };
      }

      function render() {
        const el = document.getElementById('chart');
        if (!chart) chart = echarts.init(el);
        const { cats, vals } = buildRandomSeries();
        chart.setOption(
          {
            backgroundColor: 'transparent',
            title: {
              text: '季度销量（随机，页面不导出）',
              left: 'center',
              textStyle: { color: '#e7ecf3', fontSize: 14 },
            },
            tooltip: {
              trigger: 'axis',
              axisPointer: { type: 'shadow' },
              formatter: (params) => {
                const p = Array.isArray(params) ? params[0] : params;
                return `${p.name}<br/>销量：${p.value}`;
              },
            },
            grid: { left: 48, right: 24, top: 56, bottom: 40 },
            xAxis: {
              type: 'category',
              data: cats,
              axisLabel: { color: '#8b9bb4' },
              axisLine: { lineStyle: { color: '#2a3548' } },
            },
            yAxis: {
              type: 'value',
              axisLabel: { color: '#8b9bb4' },
              splitLine: { lineStyle: { color: '#243044' } },
            },
            series: [
              {
                name: '销量',
                type: 'bar',
                data: vals,
                itemStyle: { color: '#3d8bfd', borderRadius: [4, 4, 0, 0] },
                barMaxWidth: 48,
              },
            ],
          },
          true,
        );
      }

      function peekSecret() {
        return {
          categories: [...secretCategories],
          values: [...secretValues],
        };
      }

      return { render, peekSecret };
    })();

    document.getElementById('btn-reshuffle').addEventListener('click', () => {
      SitePrivate.render();
      const out = document.getElementById('secret-out');
      out.classList.remove('show');
      out.textContent = '';
    });

    document.getElementById('btn-reveal').addEventListener('click', () => {
      const out = document.getElementById('secret-out');
      out.classList.add('show');
      out.textContent = JSON.stringify(
        { note: '仅本页闭包真值，扩展提取结果请看插件弹窗', ...SitePrivate.peekSecret() },
        null,
        2,
      );
    });

    SitePrivate.render();
    window.addEventListener('resize', () => {
      const el = document.getElementById('chart');
      echarts.getInstanceByDom(el)?.resize();
    });
  </script>
</body>
</html>
